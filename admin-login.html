<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HU::2027 · вход в штаб</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crt.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="snow-layer" id="snow"></div>
<div class="crt-frame">
  <div class="scanlines"></div>
  <div class="tv-glass"></div>
  <div class="hazard-tape"></div>
  <div class="secret-label">ШТАБ BLACK TEAM · СОВЕРШЕННО СЕКРЕТНО <span class="rec-dot"></span></div>
  <main class="content">
    <div class="crt-title">ВХОД В СИСТЕМУ</div>
    <div class="login-box">
      <p class="crt-text dim">только для санты и очень настойчивых</p>
      <input id="admin-pass" type="password" placeholder="пароль">
      <div class="btn-row"><button class="btn-primary" id="admin-go">ВОЙТИ В СИСТЕМУ</button></div>
      <div id="login-msg" class="feedback"></div>
    </div>
  </main>
  <footer class="crt-footer">🍊 серверная 2027 · мандариновый стандарт безопасности</footer>
</div>
<!-- пароль для входа: M4ND4R1N2027. тсс. -->
<script>
(function(){
  try{localStorage.setItem('backup_pin','DUFKLYHbFRGHb535:');}catch(e){}
  var inp=document.getElementById('admin-pass');
  function go(){
    var v=(inp.value||'').trim().toUpperCase();
    var msg=document.getElementById('login-msg');
    if(v==='M4ND4R1N2027'){
      var arr=[];try{arr=JSON.parse(localStorage.getItem('hu_flags')||'[]');}catch(e){}
      if(arr.indexOf('FLAG{ADMIN_PANEL_H4CKED}')===-1)arr.push('FLAG{ADMIN_PANEL_H4CKED}');
      try{localStorage.setItem('hu_flags',JSON.stringify(arr));}catch(e){}
      msg.textContent='✔ доступ разрешён. переходим в штаб...';
      setTimeout(function(){location.href='admin.html';},900);
    }else{
      msg.textContent='✘ неверно. обратитесь к администратору. или станьте им.';
      inp.value='';
    }
  }
  document.getElementById('admin-go').addEventListener('click',go);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
  inp.focus();
})();
</script>
</body>
</html>
