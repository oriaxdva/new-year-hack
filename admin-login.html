<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ШТАБ :: ВХОД</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<!-- Пароль для входа: M4ND4R1N2027 — хранить в комментариях надёжно, говорил кто-то. -->
<div id="snow"></div>
<div class="garland" id="garland"></div>

<main class="panel">
  <h2>ШТАБ BLACK TEAM</h2>
  <p>Требуется пароль. Резервные коды хранятся в сейфе.</p>
  <p class="hint">Сейф не запирается. Совсем.</p>
  <div class="submit-row">
    <input id="pass" type="password" placeholder="пароль..." autocomplete="off">
    <button id="login-btn">ВОЙТИ В СИСТЕМУ</button>
  </div>
  <div id="msg"></div>
  <p class="back"><a href="index.html">&lt; назад в серверную</a></p>
</main>

<script>
"use strict";
// сервер заботливо оставил резервный код в localStorage. закодирован ROT+3.
localStorage.setItem("backup_pin", "DUFKLYH_FRGH_2027");

function addFlag(code){
  var f = [];
  try { f = JSON.parse(localStorage.getItem("hu_flags")) || []; } catch(e){}
  if(f.indexOf(code) === -1){ f.push(code); localStorage.setItem("hu_flags", JSON.stringify(f)); }
}

function login(){
  var v = document.getElementById("pass").value.trim();
  var msg = document.getElementById("msg");
  if(v === "M4ND4R1N2027"){
    addFlag("FLAG{ADMIN_PANEL_H4CKED}");
    msg.textContent = "Флаг получен: FLAG{ADMIN_PANEL_H4CKED} — перенаправляю...";
    setTimeout(function(){ location.href = "admin.html"; }, 1500);
  } else {
    msg.textContent = "Неверный пароль. Санта разочарован.";
  }
}
document.getElementById("login-btn").addEventListener("click", login);
document.getElementById("pass").addEventListener("keydown", function(e){ if(e.key === "Enter") login(); });

// снег и гирлянда (янтарная версия)
(function(){
  var box = document.getElementById("snow");
  for(var i = 0; i < 30; i++){
    var s = document.createElement("span");
    s.className = "flake"; s.textContent = "\u2744";
    s.style.left = (Math.random()*100) + "%";
    s.style.animationDuration = (8 + Math.random()*10) + "s";
    s.style.animationDelay = (-Math.random()*15) + "s";
    s.style.fontSize = (10 + Math.random()*14) + "px";
    box.appendChild(s);
  }
  var g = document.getElementById("garland");
  var cols = ["#ffd76e", "#ffb347", "#ffe8a3"];
  for(var j = 0; j < 22; j++){
    var b = document.createElement("i");
    b.className = "bulb";
    b.style.background = cols[j % 3];
    b.style.color = cols[j % 3];
    b.style.animationDelay = (j * 0.18) + "s";
    g.appendChild(b);
  }
})();
</script>
</body>
</html>
