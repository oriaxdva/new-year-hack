<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HU::2027 — вход в штаб</title>
<link rel="stylesheet" href="admin.css">
<!--
  ============================================================
  ФЛАГ №4 доступен тем, кто читает исходники:
  пароль от штаба — hackmas2027
  ============================================================
-->
</head>
<body>
<div class="snow" aria-hidden="true"></div>
<div class="garland" aria-hidden="true">
  <span>❄</span><span>🎄</span><span>❄</span><span>🍊</span><span>❄</span><span>🎄</span><span>❄</span>
</div>

<div class="login-box">
  <div class="sig">HU::ADMIN</div>
  <div class="sig-sub">// штаб кружка «Снежинка». вход только для своих</div>
  <input id="pw-input" type="password" placeholder="ПАРОЛЬ ШТАБА" autocomplete="off">
  <button id="pw-btn" type="button">ВОЙТИ</button>
  <div id="pw-error"></div>
  <div id="pw-ok" hidden>
    <div class="ok-line">✔ ДОСТУП РАЗРЕШЁН</div>
    <div class="flag-line">FLAG{ADMIN_PANEL_H4CKED}</div>
    <div class="dim">// флаг запиши на странице ЗАДАНИЯ главного канала</div>
    <a class="go-btn" href="admin.html">ПЕРЕЙТИ В ШТАБ →</a>
  </div>
  <a class="back-link" href="index.html">← вернуться на канал</a>
</div>

<script>
(function () {
  var CODE = 'hackmas2027';
  var input = document.getElementById('pw-input');
  var btn = document.getElementById('pw-btn');
  var err = document.getElementById('pw-error');
  var ok = document.getElementById('pw-ok');

  function tryLogin() {
    if ((input.value || '').trim().toLowerCase() === CODE) {
      try {
        localStorage.setItem('hu_admin_session', 'granted');
      } catch (e) {}
      err.textContent = '';
      ok.hidden = false;
      input.disabled = true;
      btn.disabled = true;
    } else {
      err.textContent = '✘ пароль не принят. подсказки — на странице входа (в исходниках)';
      input.value = '';
      input.focus();
    }
  }

  btn.addEventListener('click', tryLogin);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); tryLogin(); }
  });
  input.focus();
})();
</script>
</body>
</html>
