<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход в штаб // BLACK TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crt.css">
<link rel="stylesheet" href="admin.css">
<!--
  ═══════════════════════════════════════════
  Протокол доступа штаба, ревизия №2027.
  Пароль по-прежнему шифруется методом
  «положили под коврик». Коврик — этот комментарий.
  Пароль: M4ND4R1N2027
  ═══════════════════════════════════════════
-->
</head>
<body>
<div class="snow-layer" id="snow" aria-hidden="true"></div>
<div class="crt-frame">
  <div class="scanlines" aria-hidden="true"></div>
  <div class="tv-glass" aria-hidden="true"></div>
  <div class="hazard-tape" aria-hidden="true"></div>
  <div class="secret-label">// СОВЕРШЕННО СЕКРЕТНО · ДОСТУП ОГРАНИЧЕН //</div>
  <div class="login-box">
    <h1 class="crt-title">ВХОД В ШТАБ</h1>
    <p class="crt-text dim small">Авторизуйтесь, агент. Или не агент. Кто тут, вообще, проверяет.</p>
    <div class="submit-box">
      <input type="password" id="admin-pass" placeholder="пароль" autocomplete="off">
      <button id="admin-enter" class="btn-primary">ВОЙТИ</button>
    </div>
    <p id="login-feedback" class="feedback"></p>
    <p class="dim small">Забыли пароль? Настоящие агенты читают исходники (Ctrl+U).</p>
  </div>
  <div class="garland" id="garland" aria-hidden="true"></div>
</div>
<script>
(function(){
  var box=document.getElementById('snow');
  if(box){ for(var i=0;i<40;i++){var s=document.createElement('span');s.textContent='❄';
    s.style.left=Math.random()*100+'%';s.style.fontSize=(8+Math.random()*12)+'px';
    s.style.opacity=(0.2+Math.random()*0.4).toFixed(2);
    s.style.animationDuration=(10+Math.random()*12)+'s';
    s.style.animationDelay=(-Math.random()*20)+'s';box.appendChild(s);} }
  var g=document.getElementById('garland');
  if(g){ var cols=['#e8b84a','#e06a5a','#7ee08c','#7ab8e0'];
    for(var j=0;j<18;j++){var b=document.createElement('span');b.className='bulb';
      b.style.background=cols[j%4];b.style.color=cols[j%4];
      b.style.animationDelay=(Math.random()*2.4).toFixed(2)+'s';g.appendChild(b);} }
  var CORRECT='M4ND4R1N2027';
  function tryEnter(){
    var v=document.getElementById('admin-pass').value.trim();
    var fb=document.getElementById('login-feedback');
    if(v.toUpperCase()===CORRECT){
      localStorage.setItem('hu_admin','1');
      fb.textContent='✔ ДОСТУП РАЗРЕШЁН. ПЕРЕНАПРАВЛЕНИЕ...'; fb.style.color='var(--amber)';
      setTimeout(function(){location.href='admin.html';},700);
    }else{
      fb.textContent='✘ Неверный код. Попробуй ещё — подсказка в исходнике страницы.';
      fb.style.color='var(--red)';
    }
  }
  document.getElementById('admin-enter').addEventListener('click',tryEnter);
  document.getElementById('admin-pass').addEventListener('keydown',function(e){if(e.key==='Enter')tryEnter();});
})();
</script>
</body>
</html>
