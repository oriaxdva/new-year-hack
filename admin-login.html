<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВХОД В ШТАБ // HU::2027</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<!--
  ═════════════════════════════════════════════
  СЛУЖЕБНАЯ ЗАПИСЬ (не для сотрудников):
  Пароль от штаба: M4ND4R1N2027
  Резервный код хранится в localStorage (backup_pin), сдвинут на 3.
  ═════════════════════════════════════════════
-->
<div id="snow" aria-hidden="true"></div>
<div id="garland" aria-hidden="true"></div>
<div class="amber-panel">
  <h1>ВХОД В ШТАБ</h1>
  <p class="dim">Доступ только для Black Team. Остальные — мимо.</p>
  <div class="form-row">
    <label for="pin">КОД ДОСТУПА:</label>
    <input id="pin" type="password" autocomplete="off">
  </div>
  <button id="enter-btn">ВОЙТИ В СИСТЕМУ</button>
  <p id="err" class="err hidden">Неверный код. Попробуйте ещё раз — или изучите исходный код.</p>
</div>
<script>
(function(){
'use strict';
// Резервный код в localStorage: ROT-3 (каждый символ +3)
try{
  if(!localStorage.getItem('backup_pin')){
    var s='ARCHIVE_CODE_2027';
    localStorage.setItem('backup_pin',s.split('').map(function(c){return String.fromCharCode(c.charCodeAt(0)+3)}).join(''));
  }
}catch(e){}
// Снег и гирлянда (янтарные)
var BULB=['#e06a5a','#e8b84a','#c9d98a','#6fb7d9'];
(function(){
  var snow=document.getElementById('snow');
  var chars=['❄','❅','❆'];
  for(var i=0;i<24;i++){
    var f=document.createElement('span');
    f.className='snowflake';f.textContent=chars[i%3];
    f.style.left=(Math.random()*100)+'%';
    f.style.fontSize=(8+Math.random()*12)+'px';
    f.style.animationDuration=(9+Math.random()*12)+'s';
    f.style.animationDelay=(-Math.random()*15)+'s';
    snow.appendChild(f);
  }
  var g=document.getElementById('garland');
  for(var j=0;j<18;j++){
    var b=document.createElement('span');
    b.className='bulb';
    b.style.left=(100/18*j+2.7)+'%';
    b.style.top=(6+Math.sin(j/3)*8)+'px';
    b.style.background=BULB[j%4];b.style.color=BULB[j%4];
    b.style.setProperty('--dur',(2.2+Math.random()*2.5).toFixed(2)+'s');
    b.style.animationDelay=(-Math.random()*4)+'s';
    g.appendChild(b);
  }
})();
var PASS='M4ND4R1N2027';
document.getElementById('enter-btn').addEventListener('click',function(){
  var v=document.getElementById('pin').value.trim();
  if(v===PASS){
    try{localStorage.setItem('hu_logged','1')}catch(e){}
    try{submitFlag('FLAG{ADMIN_PANEL_H4CKED}')}catch(e){}
    if(typeof submitFlag!=='function'){
      // флаг сдается на странице админки; просто переходим
    }
    location.href='admin.html';
  }else{
    document.getElementById('err').classList.remove('hidden');
  }
});
document.getElementById('pin').addEventListener('keydown',function(e){
  if(e.key==='Enter')document.getElementById('enter-btn').click();
});
})();
</script>
</body>
</html>
