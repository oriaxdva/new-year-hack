<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HU :: ВХОД В ШТАБ</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crt.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<!--
  СЛУЖЕБНАЯ ЗАПИСЬ (для участников хакатона):
  пароль от штаба: M4ND4R1N2027
  P.S. Пароли в комментариях — плохая идея. Но сервер-то какой доверчивый...
-->
<div class="broadcast-container">
  <div class="crt-frame">
    <div class="tv-glass"></div>
    <div class="scanlines"></div>
    <div class="static-noise"></div>
    <div class="secret-tape">СОВЕРШЕННО СЕКРЕТНО · ШТАБ RED TEAM</div>
    <h1 class="crt-title amber-title">ВХОД В ШТАБ</h1>
    <p class="crt-text small">Только для сотрудников. Посторонним вход воспрещён. Особенно посторонним, которые это читают.</p>
    <div class="auth-box">
      <label for="login">ЛОГИН</label>
      <input type="text" id="login" value="admin" autocomplete="off">
      <label for="password">ПАРОЛЬ</label>
      <input type="password" id="password" autocomplete="off">
      <button class="btn-primary" id="login-btn">ВОЙТИ</button>
      <p class="crt-text small" id="login-msg"></p>
    </div>
  </div>
</div>
<script>
(function(){
  var btn = document.getElementById('login-btn');
  var pass = document.getElementById('password');
  var msg = document.getElementById('login-msg');
  function tryLogin(){
    if (pass.value === 'M4ND4R1N2027'){
      localStorage.setItem('hu_role', 'guest'); // «сервер» выдаёт роль прямо в браузер
      location.href = 'admin.html';
    } else {
      msg.textContent = 'ОТКАЗАНО. НЕВЕРНЫЙ ПАРОЛЬ.';
      msg.style.color = '#ff3b30';
    }
  }
  btn.addEventListener('click', tryLogin);
  pass.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryLogin(); });
})();
</script>
</body>
</html>
