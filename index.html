<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RED TEAM // ПРЯМОЙ ЭФИР</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="crt.css">
</head>
<body>
<!-- FLAG{HTML_C0MMENT_2027} -->

<div id="broadcast-screen" class="broadcast-container">
  <div class="crt-frame">
    <div class="scanlines"></div>
    <div class="tv-glass"></div>
    <div class="video-area">

      <!-- Видео (если файл president.mp4 лежит рядом — запустится оно) -->
      <video id="local-video" src="president.mp4" loop playsinline muted></video>

      <!-- Текстовый эфир (работает всегда, если видео нет) -->
      <div id="text-broadcast" class="text-broadcast hidden">
        <div class="static-noise"></div>
        <div class="broadcast-text">
          <span class="line">ПРЯМОЙ ЭФИР</span>
          <span class="line small">ШТАБ RED TEAM &#8226; ПРЕЗИДЕНТ ХАКЕРОВ</span>
          <div class="message-box">
            <span id="typed-message" class="typed"></span>
            <span class="cursor">_</span>
          </div>
        </div>
      </div>

      <!-- Резервное сообщение, если видео не нашлось -->
      <div id="no-video-fallback" class="fallback-msg hidden">
        ВИДЕОСИГНАЛ ПОТЕРЯН. ПЕРЕХОД НА ТЕКСТОВЫЙ КАНАЛ...
      </div>

    </div>
  </div>

  <button id="play-broadcast-btn" class="btn-primary">СТАРТ ТРАНСЛЯЦИИ</button>
</div>

<script src="app.js"></script>
<script>
  // Пасхалка для тех, кто открывает консоль
  console.log('%c[RED TEAM] Доступ ограничен.', 'color:#33ff66;font-family:monospace;font-size:14px;');
  console.log('%cПодсказка: настоящие хакеры читают всё. Даже исходники. FLAG{C0NS0LE_HUNT_2027}', 'color:#ffaa33;font-family:monospace;font-size:12px;');
</script>
</body>
</html>
