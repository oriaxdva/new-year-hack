<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 Not Found</title>
<link rel="stylesheet" href="../santa.css">
<style>
  .gift-row{display:flex;gap:14px;justify-content:center;margin:26px 0;flex-wrap:wrap}
  .gift-box{width:92px;height:92px;border:2px solid var(--red-dim);display:flex;align-items:center;justify-content:center;
    font-size:44px;cursor:pointer;user-select:none;transition:transform .15s, border-color .15s}
  .gift-box:hover{transform:translateY(-4px);border-color:var(--red)}
  .gift-box.opened{opacity:.35;cursor:default}
  .reg-note{text-align:center;margin-top:18px;min-height:1.4em}
</style>
</head>
<body>
<div class="crt-frame">
  <div class="garland"></div>
  <header class="crt-header">
    <div class="header-top"><div class="logo">404 <span class="logo-accent">· Not Found</span></div></div>
  </header>
  <main class="crt-main">
    <section class="crt-section active">
      <h2 class="crt-title">страница не найдена</h2>
      <p class="crt-text">запрошенный ресурс отсутствует. возможно, он никогда не существовал.</p>
      <p class="crt-text dim">…но подарки уже распределены.</p>
      <div class="gift-row">
        <div class="gift-box" data-i="1">🎁</div>
        <div class="gift-box" data-i="2">🎁</div>
        <div class="gift-box" data-i="3">🎁</div>
      </div>
      <p class="reg-note" id="reg-note"></p>
    </section>
    <div class="scanlines"></div>
    <div class="tv-glass"></div>
  </main>
  <footer class="crt-footer">🎄 🎄 🎄 служба доставки · северный полюс</footer>
</div>
<script>
(function(){
  var opened=0, lines=[
    'подарок №1: носки с оленями. распакован.',
    'подарок №2: мандариновая группа повышенной опасности. распакована.',
    'подарок №3: доступ к реестру. распакован.'
  ];
  var boxes=document.querySelectorAll('.gift-box');
  boxes.forEach(function(b){
    b.addEventListener('click',function(){
      if(b.classList.contains('opened')) return;
      b.classList.add('opened');
      b.textContent='📦';
      var n=document.getElementById('reg-note');
      n.textContent=lines[opened];
      opened++;
      if(opened===3){
        n.innerHTML='реестр вскрыт. флаг для сдачи на сервере: <b>FLAG{N0_R0BOTS_ALL0W3D}</b>';
        try{
          var arr=JSON.parse(localStorage.getItem('santa_flags')||'[]');
          if(arr.indexOf('FLAG{N0_R0BOTS_ALL0W3D}')===-1){arr.push('FLAG{N0_R0BOTS_ALL0W3D}');}
          localStorage.setItem('santa_flags',JSON.stringify(arr));
        }catch(e){}
      }
    });
  });
})();
</script>
</body>
</html>
