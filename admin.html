<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HU::2027 · штаб</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crt.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="snow-layer" id="snow"></div>
<div class="crt-frame">
  <div class="scanlines"></div>
  <div class="tv-glass"></div>
  <div class="hazard-tape"></div>
  <div class="secret-label">ШТАБ BLACK TEAM · СОВЕРШЕННО СЕКРЕТНО <span class="rec-dot"></span></div>
  <main class="content">
    <div class="crt-title">ШТАБ</div>
    <nav class="crt-nav" id="admin-nav">
      <button data-sec="notes" class="active">ЗАМЕТКИ</button>
      <button data-sec="storage">ХРАНИЛИЩЕ</button>
      <button data-sec="safe">СЕЙФ</button>
    </nav>
    <section class="crt-section active" id="sec-notes">
      <p class="crt-text dim small">служебные заметки. нумерация с единицы.</p>
      <div id="notes-box"></div>
      <p class="dim small">подсказка: admin.html?note=3</p>
    </section>
    <section class="crt-section" id="sec-storage">
      <div id="storage-content"></div>
    </section>
    <section class="crt-section" id="sec-safe">
      <p class="crt-text dim">резервный код доступа. найти его — отдельная задача.</p>
      <div class="safe-box">
        <input id="safe-code" placeholder="введите код">
        <div class="btn-row"><button class="btn-primary" id="safe-go">ОТКРЫТЬ</button></div>
        <div id="safe-msg" class="feedback"></div>
        <div id="safe-banner" class="flag-banner hidden"></div>
      </div>
    </section>
  </main>
  <footer class="crt-footer">🍊 штаб · 2027</footer>
</div>
<script src="admin-app.js"></script>
</body>
</html>
