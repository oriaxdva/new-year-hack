<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ШТАБ — панель</title>
<link rel="stylesheet" href="admin.css">
<script>
/* страж: без сессии страница даже не отрисовывается */
(function(){ if(!localStorage.getItem('hu_admin_session')){ location.replace('admin-login.html'); } })();
</script>
<style>html{visibility:hidden}</style>
</head>
<body>
<header id="admin-topbar">
  <span class="logo">ШТАБ :: 2027</span>
  <button id="logout" type="button">ВЫЙТИ</button>
</header>
<main>
  <section id="notes">
    <h2>СЛУЖЕБНЫЕ ЗАМЕТКИ</h2>
    <ol id="notes-list">
      <li><a href="admin.html?note=1">заметка 1: план сани</a></li>
      <li><a href="admin.html?note=2">заметка 2: реестр подарков</a></li>
      <li><a href="admin.html?note=3">заметка 3: [удалено модератором]</a></li>
    </ol>
  </section>
  <section id="roles">
    <h2>УПРАВЛЕНИЕ РОЛЯМИ</h2>
    <p>ваша роль: <span id="role-now">guest</span></p>
    <input id="role-input" placeholder="новая роль" autocomplete="off">
    <button id="role-apply" type="button">ПРИМЕНИТЬ</button>
    <div id="role-msg" role="status"></div>
  </section>
</main>
<div id="note-modal" hidden>
  <div class="note-box">
    <h3 id="note-title"></h3>
    <p id="note-body"></p>
    <button id="note-close" type="button">ЗАКРЫТЬ</button>
  </div>
</div>
<script src="admin-app.js"></script>
</body>
</html>
