<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ШТАБ BLACK TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crt.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
<div class="scanlines"></div>
<div class="static-noise"></div>

<div class="broadcast-container">
  <h1 class="crt-title">ШТАБ BLACK TEAM <span class="rec-dot"></span><span class="rec-label">REC</span></h1>
  <div class="secret-tape">СОВЕРШЕННО СЕКРЕТНО // BLACK TEAM ONLY</div>
  <p>
    <a class="nav-btn" href="index.html">&larr; НА ГЛАВНУЮ</a>
    <button id="logout" class="btn-ghost">ВЫЙТИ</button>
  </p>

  <section class="content-block">
    <h2 class="crt-title">ЗАМЕТКИ</h2>
    <p class="crt-text small">Открыть заметку по id. Публичные записи: 1 и 2.</p>
    <div class="submit-box">
      <input id="note-id" type="text" placeholder="id заметки">
      <button id="note-open" class="btn-primary">ОТКРЫТЬ</button>
    </div>
    <div id="note-view"></div>
  </section>

  <section class="content-block">
    <h2 class="crt-title">ХРАНИЛИЩЕ ФЛАГОВ</h2>
    <div id="storage-view"></div>
  </section>

  <footer class="crt-footer">// ШТАБ ОХРАНЯЕТСЯ РОЛЬЮ ИЗ localStorage. СЕРЬЁЗНО. //</footer>
</div>

<script>
(function () {
  if (localStorage.getItem('hu_admin') !== '1') { location.replace('admin-login.html'); return; }
  function addFlag(f) {
    var s = [];
    try { s = JSON.parse(localStorage.getItem('hu_flags') || '[]') || []; } catch (e) {}
    if (s.indexOf(f) === -1) { s.push(f); localStorage.setItem('hu_flags', JSON.stringify(s)); }
  }
  var NOTES = {
    '1': { author: 'santa.exe', text: 'Планировка подарков на 2027: транзисторов — 100500, мандаринов — ещё больше. Не перепутать местами.' },
    '2': { author: 'santa.exe', text: 'Напоминание себе: код активации нигде не публиковать. Даже в стикерах. Даже в тёплых варежках.' },
    '3': { author: 'SYSTEM', text: 'СЛУЖЕБНАЯ ЗАПИСЬ. Кто-то сливал заметки через подмену id в адресе запроса. Это твой флаг: FLAG{IDOR_N0TES_2027}. Ладно, признаю: оставил нарочно. С Новым годом.' }
  };
  function openNote() {
    var id = document.getElementById('note-id').value.trim();
    var view = document.getElementById('note-view');
    var n = NOTES[id];
    view.innerHTML = '';
    if (!n) {
      view.innerHTML = '<div class="access-denied">Заметка ' + id.replace(/[<>&]/g, '') + ' не найдена. Или ты не должен её видеть. Или оба.</div>';
      return;
    }
    var cls = (id === '3') ? 'note-card secret' : 'note-card';
    view.innerHTML = '<div class="' + cls + '"><span class="author">' + n.author + '</span><p></p></div>';
    view.querySelector('p').textContent = n.text;
    if (id === '3') {
      addFlag('FLAG{IDOR_N0TES_2027}');
      view.innerHTML += '<div class="flag-banner">IDOR ПОДТВЕРЖДЁН. ФЛАГ: FLAG{IDOR_N0TES_2027}</div>';
    }
  }
  document.getElementById('note-open').addEventListener('click', openNote);
  document.getElementById('note-id').addEventListener('keydown', function (e) { if (e.key === 'Enter') openNote(); });

  function renderStorage() {
    var view = document.getElementById('storage-view');
    if (localStorage.getItem('hu_role') === 'admin') {
      view.innerHTML = '<div class="flag-banner">ДОСТУП ROOT. ФЛАГ: FLAG{R0LE_SW4P_2027}</div>' +
        '<p class="crt-text small">Ты сейчас не admin. Ты просто написал admin в localStorage — и сервер поверил. Запомни это: так работают реальные уязвимости broken access control.</p>';
      addFlag('FLAG{R0LE_SW4P_2027}');
    } else {
      view.innerHTML = '<div class="access-denied">ДОСТУП ЗАПРЕЩЁН. РОЛЬ: GUEST.<br>Сервер верит тому, что написано в твоём localStorage. Обратитесь к администратору. Или станьте им.</div>';
    }
  }
  renderStorage();

  document.getElementById('logout').addEventListener('click', function () {
    localStorage.removeItem('hu_admin');
    localStorage.removeItem('hu_role');
    location.href = 'admin-login.html';
  });
})();
</script>
</body>
</html>
