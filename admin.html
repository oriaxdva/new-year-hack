<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Штаб</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="snow"></div>
<div class="garland"></div>

<main class="panel">
  <h1>ШТАБ // ПАНЕЛЬ</h1>
  <p class="muted">user: guest · роль: <span id="role">guest</span></p>

  <section>
    <h2>Записки дежурных</h2>
    <ul class="notes">
      <li><a href="admin.html?note=1">Заметка #1 — порядок в серверной</a></li>
      <li><a href="admin.html?note=2">Заметка #2 — смены на праздники</a></li>
    </ul>
    <div id="note-box" hidden>
      <p><b id="note-title"></b></p>
      <p id="note-text"></p>
    </div>
  </section>

  <section>
    <h2>Хранилище</h2>
    <div id="vault-denied" class="err">
      ДОСТУП ЗАПРЕЩЁН.<br>
      <span class="muted">Обратитесь к администратору. Или станьте им.</span>
    </div>
    <div id="vault-open" hidden>
      <p>Флаг хранилища: <span class="flagline">FLAG{R0LE_SW4P_2027}</span></p>
    </div>
    <h2>Резервный код</h2>
    <form id="safe">
      <input id="code" type="text" placeholder="код" autocomplete="off">
      <button class="primary">ОТКРЫТЬ</button>
    </form>
    <p id="safe-msg"></p>
  </section>

  <a class="back" href="index.html">← на главную</a>
</main>

<script>

(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var snowBox = document.getElementById('snow');
  if(snowBox && !reduce){
    var N = window.innerWidth < 700 ? 22 : 36;
    var glyphs = ['❄','❅','❆','*'];
    for(var i = 0; i < N; i++){
      var f = document.createElement('i');
      f.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      f.style.left = (Math.random() * 100) + '%';
      f.style.fontSize = (8 + Math.random() * 12) + 'px';
      f.style.opacity = (.25 + Math.random() * .45).toFixed(2);
      f.style.animationDuration = (9 + Math.random() * 14) + 's';
      f.style.animationDelay = (-Math.random() * 20) + 's';
      snowBox.appendChild(f);
    }
  }
  var g = document.querySelector('.garland');
  if(g){
    var colors = ['#ffd166','#ff7a7a','#8bd3ff','#ffd166'];
    for(var j = 0; j < 16; j++){
      var b = document.createElement('i');
      b.style.background = colors[j % 4];
      b.style.color = colors[j % 4];
      b.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
      g.appendChild(b);
    }
  }
})();


(function(){
  if(!localStorage.getItem('backup_pin')){
    localStorage.setItem('backup_pin', 'DUFKLYH_FRGH_2027');
  }
  var flags = JSON.parse(localStorage.getItem('hu_flags') || '[]');
  function addFlag(f){
    if(flags.indexOf(f) < 0){
      flags.push(f);
      localStorage.setItem('hu_flags', JSON.stringify(flags));
    }
  }

  var notes = {
    '1': ['Заметка #1 — порядок в серверной',
          'Гирлянду не трогать. Она морально поддерживает стойки.'],
    '2': ['Заметка #2 — смены на праздники',
          '31-го дежурят все. Мандарины хранили в сейфе — «хранили», заметьте, в прошедшем.'],
    '3': ['Заметка #3 — служебная',
          'Доступ: только админ. Ладно, раз уж ты здесь: FLAG{ID0R_N0TE_3}']
  };
  var note = new URLSearchParams(location.search).get('note');
  var box = document.getElementById('note-box');
  if(note && notes[note]){
    box.hidden = false;
    document.getElementById('note-title').textContent = notes[note][0];
    document.getElementById('note-text').textContent = notes[note][1];
    if(note === '3') addFlag('FLAG{ID0R_N0TE_3}');
  }

  if(localStorage.getItem('hu_role') === 'admin'){
    document.getElementById('role').textContent = 'admin';
    document.getElementById('vault-denied').hidden = true;
    document.getElementById('vault-open').hidden = false;
    addFlag('FLAG{R0LE_SW4P_2027}');
  }

  document.getElementById('safe').addEventListener('submit', function(e){
    e.preventDefault();
    var v = document.getElementById('code').value.trim();
    var m = document.getElementById('safe-msg');
    if(v === 'ARCHIVE_CODE_2027'){
      addFlag('FLAG{ARC_H1VE_2027}');
      m.textContent = 'Сейф открылся. Флаг: FLAG{ARC_H1VE_2027}';
      m.className = 'ok';
    } else {
      m.textContent = 'Код не подошёл. Сейф обиделся, но недолго.';
      m.className = 'err';
    }
  });
})();
</script>
</body>
</html>
