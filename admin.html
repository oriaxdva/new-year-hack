<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ШТАБ // АДМИН-ПАНЕЛЬ</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crt.css">
<link rel="stylesheet" href="admin.css">
<!--
  ═══════════════════════════════════════════
  Внутренняя документация штаба (не для чужих).

  1) Заметки нумеруются по id. Служебные заметки
     тоже нумеруются по id. Даже если их «нет» в списке.

  2) Хранилище флагов открывается по роли.
     Роль сервер берёт из localStorage ключа hu_role.
     Сервер доверяет браузеру. Сервер наивен.
  ═══════════════════════════════════════════
-->
</head>
<body>
<div class="snow-layer" id="snow" aria-hidden="true"></div>
<div class="crt-frame">
  <div class="scanlines" aria-hidden="true"></div>
  <div class="tv-glass" aria-hidden="true"></div>
  <div class="hazard-tape" aria-hidden="true"></div>
  <div class="secret-label">// ШТАБ BLACK TEAM · АДМИН-ПАНЕЛЬ · ЗАПИСЬ ВЕДЕТСЯ <span class="rec-dot"></span> //</div>

  <nav class="crt-nav admin-nav" id="admin-nav">
    <button data-atab="notes" class="active">ЗАМЕТКИ</button>
    <button data-atab="vault">ХРАНИЛИЩЕ ФЛАГОВ</button>
    <button id="logout" class="btn-ghost small" style="margin-left:auto">ВЫЙТИ</button>
  </nav>

  <main class="content">

    <section id="notes" class="crt-section active">
      <h2 class="crt-title">ЗАМЕТКИ СОТРУДНИКОВ</h2>
      <p class="crt-text dim small">Фильтр заметок по id: <input id="note-id" type="number" min="1" placeholder="id" style="width:80px"> <button id="note-open" class="btn-ghost small">ОТКРЫТЬ</button></p>
      <div id="notes-list" class="notes"></div>
      <div id="note-secret" class="hidden"></div>
    </section>

    <section id="vault" class="crt-section">
      <h2 class="crt-title">ХРАНИЛИЩЕ ФЛАГОВ</h2>
      <div id="vault-denied" class="access-denied">
        <p>⛔ ДОСТУП ЗАПРЕЩЁН</p>
        <p class="small">Ваша роль: <b id="role-now">guest</b>. Нужна роль admin.</p>
        <p class="small dim">Сервер верит тому, что написано в вашем localStorage. Сервер наивен. Обратитесь к администратору. Или станьте им.</p>
      </div>
      <div id="vault-open" class="hidden"></div>
    </section>

  </main>
</div>
<script>
(function(){
  if(localStorage.getItem('hu_admin')!=='1'){ location.href='admin-login.html'; return; }
  function submitFlag(f){
    var arr=[]; try{arr=JSON.parse(localStorage.getItem('hu_flags')||'[]');}catch(e){}
    if(arr.indexOf(f)===-1){arr.push(f);localStorage.setItem('hu_flags',JSON.stringify(arr));}
  }
  /* снегопад */
  var box=document.getElementById('snow');
  if(box){ for(var i=0;i<40;i++){var s=document.createElement('span');s.textContent='❄';
    s.style.left=Math.random()*100+'%';s.style.fontSize=(8+Math.random()*12)+'px';
    s.style.opacity=(0.2+Math.random()*0.4).toFixed(2);
    s.style.animationDuration=(10+Math.random()*12)+'s';
    s.style.animationDelay=(-Math.random()*20)+'s';box.appendChild(s);} }
  /* вкладки */
  document.getElementById('admin-nav').addEventListener('click',function(e){
    var b=e.target.closest('button[data-atab]'); if(!b) return;
    document.querySelectorAll('#admin-nav button[data-atab]').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.crt-section').forEach(function(s){s.classList.remove('active');});
    b.classList.add('active');
    document.getElementById(b.dataset.atab).classList.add('active');
  });
  document.getElementById('logout').addEventListener('click',function(){
    localStorage.removeItem('hu_admin'); location.href='admin-login.html';
  });
  /* заметки */
  var NOTES=[
    {id:1,who:'sysadmin',txt:'Не забудьте выключить ёлку в серверной. Опять пожарная сигнализация сойдёт с ума.'},
    {id:2,who:'jr.helper',txt:'А где лежит список флагов? Мне сказали «на странице задания», но там одни вопросики.'}
  ];
  var list=document.getElementById('notes-list');
  NOTES.forEach(function(n){
    var d=document.createElement('div'); d.className='note';
    d.innerHTML='<span class="who">'+n.who+' · id='+n.id+'</span><div class="txt"></div>';
    d.querySelector('.txt').textContent=n.txt;
    list.appendChild(d);
  });
  var SECRET={id:3,who:'root',txt:'Служебная заметка (id=3). Кто-то сливал заметки через подмену id. Я оставляю здесь кое-что важное, чтобы никто не забыл: FLAG{IDOR_N0TES_2027}. И мандарины в сейфе.'};
  function openNote(id){
    var holder=document.getElementById('note-secret');
    id=parseInt(id,10);
    var n=NOTES.find(function(x){return x.id===id;});
    if(!n && id===3) n=SECRET;
    if(!n){ holder.className='note flagged'; holder.textContent='заметка не найдена (или у неё слишком любопытный id).'; holder.classList.remove('hidden'); return; }
    if(n===SECRET){
      holder.className='note flagged';
      holder.innerHTML='<span class="who">'+n.who+' · id='+n.id+'</span><div class="txt"></div><div class="flag-banner">★ '+n.txt.match(/FLAG\{[^}]+\}/)[0]+' ★</div>';
      holder.querySelector('.txt').textContent=n.txt;
      holder.classList.remove('hidden');
      submitFlag('FLAG{IDOR_N0TES_2027}');
    }else{
      holder.className='note';
      holder.innerHTML='<span class="who">'+n.who+' · id='+n.id+'</span><div class="txt"></div>';
      holder.querySelector('.txt').textContent=n.txt;
      holder.classList.remove('hidden');
    }
  }
  document.getElementById('note-open').addEventListener('click',function(){openNote(document.getElementById('note-id').value);});
  /* хранилище */
  var role=localStorage.getItem('hu_role')||'guest';
  document.getElementById('role-now').textContent=role;
  if(role==='admin'){
    document.getElementById('vault-denied').classList.add('hidden');
    var v=document.getElementById('vault-open');
    v.className='flag-banner';
    v.innerHTML='★ FLAG{R0LE_SW4P_2027} — роль подменена, хранилище открыто ★';
    v.classList.remove('hidden');
    submitFlag('FLAG{R0LE_SW4P_2027}');
  }
})();
</script>
</body>
</html>
