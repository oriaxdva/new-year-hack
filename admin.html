<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ШТАБ :: ПАНЕЛЬ</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="snow"></div>
<div class="garland" id="garland"></div>

<main class="panel">
  <h2>ПАНЕЛЬ ШТАБА</h2>
  <p class="ticker">СОВЕРШЕННО СЕКРЕТНО · КОПИРОВАТЬ ЗАПРЕЩЕНО · ПОПРОБУЙ ВСЁ-ТАКИ</p>

  <h3>ЗАМЕТКИ</h3>
  <div id="note-view" class="box"></div>
  <div class="nav-notes">
    <button onclick="showNote(1)">id=1</button>
    <button onclick="showNote(2)">id=2</button>
    <button onclick="showNote(3)">id=3</button>
    <button onclick="showNote(4)">id=4</button>
  </div>

  <h3>ХРАНИЛИЩЕ</h3>
  <div class="box">
    <div id="store-view">проверка доступа...</div>
    <button onclick="checkStore()">ПРОВЕРИТЬ ДОСТУП</button>
  </div>

  <h3>СЕЙФ</h3>
  <div class="box">
    <div class="submit-row">
      <input id="safe-input" placeholder="резервный код..." autocomplete="off">
      <button onclick="openSafe()">ОТКРЫТЬ</button>
    </div>
    <div id="safe-msg"></div>
  </div>

  <p class="back"><a href="index.html">&lt; назад в серверную</a></p>
</main>

<script>
"use strict";
function addFlag(code){
  var f = [];
  try { f = JSON.parse(localStorage.getItem("hu_flags")) || []; } catch(e){}
  if(f.indexOf(code) === -1){
    f.push(code);
    localStorage.setItem("hu_flags", JSON.stringify(f));
    console.log("[BLACK TEAM] Флаг принят: " + code);
  }
}

// заметки: id=3 — служебная, доступна любому, кто умеет менять параметр
var NOTES = {
  1: ["n0ctis", "Планы на 27-е: обновить гирлянду, проверить бэкапы, не забыть мандарины."],
  2: ["phantom_404", "Кто-то снова зашёл под guest. Роли же лежат у вас в браузере, ребята."],
  3: ["SYSTEM", "СЛУЖЕБНАЯ ЗАПИСКА // Флаг №5: FLAG{IDOR_NOTE_3_2027} // Удалить не успели: «позже» длиной в год."],
  4: ["black_ops_7", "Хранилище: доступ по роли. Роль меняется там же, где и всё остальное."]
};
function showNote(n){
  var box = document.getElementById("note-view");
  var note = NOTES[n];
  if(!note){
    box.innerHTML = "<span class=who>SYSTEM:</span> Заметка не найдена. Даже Санта не знает, куда она делась.";
    return;
  }
  box.innerHTML = "<span class=who>" + note[0] + ":</span> " + note[1];
  if(n === 3) addFlag("FLAG{IDOR_NOTE_3_2027}");
}
showNote(1);

// хранилище: пустит только admin
function checkStore(){
  var v = document.getElementById("store-view");
  var role = localStorage.getItem("hu_role") || "guest";
  if(role === "admin"){
    v.innerHTML = "доступ: <b>admin</b>. Здравствуй, начальник.<br>Флаг: <b>FLAG{STORAGE_ROLE_2027}</b>";
    addFlag("FLAG{STORAGE_ROLE_2027}");
  } else {
    v.innerHTML = "доступ: <b>" + role + "</b>. Обратитесь к администратору. Или станьте им.";
  }
}
checkStore();

// сейф: резервный код из localStorage, закодирован ROT+3
function openSafe(){
  var v = (document.getElementById("safe-input").value || "").trim();
  var msg = document.getElementById("safe-msg");
  if(v === "ARCHIVE_CODE_2027"){
    msg.textContent = "Сейф открыт. Флаг: FLAG{ARCHIVE_CODE_2027}";
    addFlag("FLAG{ARCHIVE_CODE_2027}");
  } else {
    msg.textContent = "Не подходит. Подсказка: код уже у тебя в браузере, просто сдвинут.";
  }
}

// снег и гирлянда
(function(){
  var box = document.getElementById("snow");
  for(var i = 0; i < 30; i++){
    var s = document.createElement("span");
    s.className = "flake"; s.textContent = "\u2744";
    s.style.left = (Math.random()*100) + "%";
    s.style.animationDuration = (8 + Math.random()*10) + "s";
    s.style.animationDelay = (-Math.random()*15) + "s";
    s.style.fontSize = (10 + Math.random()*14) + "px";
    box.appendChild(s);
  }
  var g = document.getElementById("garland");
  var cols = ["#ffd76e", "#ffb347", "#ffe8a3"];
  for(var j = 0; j < 22; j++){
    var b = document.createElement("i");
    b.className = "bulb";
    b.style.background = cols[j % 3];
    b.style.color = cols[j % 3];
    b.style.animationDelay = (j * 0.18) + "s";
    g.appendChild(b);
  }
})();
</script>
</body>
</html>
