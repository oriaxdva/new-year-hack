<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HU::ADMIN — штаб</title>
<!-- СТРАЖ: без сессии страница не отрисовывается и уходит на вход -->
<script>
  if (!localStorage.getItem('hu_admin_session')) {
    document.documentElement.style.visibility = 'hidden';
    location.replace('admin-login.html');
  }
</script>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="snow" aria-hidden="true"></div>
<div class="garland" aria-hidden="true">
  <span>❄</span><span>🎄</span><span>❄</span><span>🍊</span><span>❄</span><span>🎄</span><span>❄</span>
</div>

<div class="panel">
  <header class="panel-head">
    <div class="sig">HU::ADMIN</div>
    <div class="sig-sub">// служебная панель кружка «Снежинка»</div>
    <nav class="nav">
      <a href="#notes">ЗАПИСКИ</a>
      <a href="#ops">ОПЕРАЦИИ</a>
      <a href="#" id="logout-link">ВЫЙТИ</a>
      <a href="index.html">← НА КАНАЛ</a>
    </nav>
  </header>

  <section id="notes" class="sec">
    <h2>[ ЗАПИСКИ ]</h2>
    <div class="dim">// записки нумеруются подряд. все как один</div>
    <div class="note-tabs">
      <button class="note-tab" data-note="1" type="button">записка #1</button>
      <button class="note-tab" data-note="2" type="button">записка #2</button>
    </div>
    <div id="note-view" class="note-view">выбери записку выше</div>
  </section>

  <section id="ops" class="sec">
    <h2>[ ОПЕРАЦИИ ]</h2>
    <div class="dim">// панель проверки роли. доверяем браузеру — он же свой</div>
    <div id="role-view" class="role-view"></div>
    <div class="submit-line">
      <input id="cmd-input" type="text" placeholder="ВВЕДИ КОМАНДУ" autocomplete="off">
      <button id="cmd-btn" type="button">ВЫПОЛНИТЬ</button>
    </div>
    <div id="cmd-msg"></div>
  </section>

  <footer class="panel-foot">
    <span class="dim">// штаб не запирается. но и не рекламируется</span>
  </footer>
</div>

<script src="admin-app.js"></script>
</body>
</html>
